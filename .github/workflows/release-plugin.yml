name: Release Plugin (reusable)

on:
  workflow_call:
    inputs:
      plugin_slug:
        description: Catalog slug in fugs-plugins (e.g. fugs-chat-bubbles)
        required: true
        type: string
      plugin_name:
        description: Human display name
        required: true
        type: string
      short_name:
        description: Zip / file basename without version (e.g. FugsChatBubbles)
        required: true
        type: string
      version:
        description: Semver without leading v (e.g. 1.0.0)
        required: true
        type: string
      tag_name:
        description: Git tag including leading v (e.g. v1.0.0)
        required: true
        type: string
      files:
        description: Newline-separated paths relative to repo root to include in the zip
        required: true
        type: string
      install_notes:
        description: Extra plain-text lines appended to INSTALL.txt
        required: false
        type: string
        default: ""
      directory_repo:
        description: Shared plugin directory repository (owner/name)
        required: false
        type: string
        default: SpaceFoon/RPG-Maker-MV-MZ-plugins
      category:
        description: Catalog category for a newly registered plugin
        required: false
        type: string
        default: Other
      compatibility:
        description: Explicitly reviewed engine compatibility for this release
        required: false
        type: string
        default: ""
    secrets:
      FUGS_SITE_SYNC_TOKEN:
        description: Token with Contents write access on the shared plugin directory repo
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Zip, release, update shared directory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4

      - name: Stage release files
        id: stage
        env:
          FILES: ${{ inputs.files }}
          SHORT_NAME: ${{ inputs.short_name }}
          VERSION: ${{ inputs.version }}
          PLUGIN_NAME: ${{ inputs.plugin_name }}
          INSTALL_NOTES: ${{ inputs.install_notes }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          STAGE="release-staging/${SHORT_NAME}"
          mkdir -p "$STAGE"

          while IFS= read -r path; do
            path="$(echo "$path" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$path" ] && continue
            if [ ! -e "$path" ]; then
              echo "::error::Missing file: $path"
              exit 1
            fi
            mkdir -p "$STAGE/$(dirname "$path")"
            cp -a "$path" "$STAGE/$path"
          done <<< "$FILES"

          {
            echo "${PLUGIN_NAME}"
            echo "Version ${VERSION}"
            echo "Repository: https://github.com/${GITHUB_REPOSITORY}"
            echo "Release tag: ${TAG_NAME}"
            echo ""
            echo "======== INSTALL ========"
            echo ""
            echo "1. Unzip this archive."
            echo "2. Copy the .js plugin file(s) into your RPG Maker project's js/plugins/ folder."
            echo "3. Open Plugin Manager, add the plugin(s), and turn them ON."
            echo "4. Configure parameters as needed, then save your project."
            echo ""
            if [ -n "${INSTALL_NOTES}" ]; then
              echo "======== NOTES ========"
              echo ""
              printf '%s\n' "${INSTALL_NOTES}"
              echo ""
            fi
            if [ -f README.md ]; then
              echo "======== README ========"
              echo ""
              sed -E \
                -e 's/^#{1,6}[[:space:]]*//' \
                -e 's/\*\*([^*]+)\*\*/\1/g' \
                -e 's/\*([^*]+)\*/\1/g' \
                -e 's/`([^`]+)`/\1/g' \
                -e 's/\[([^]]+)\]\(([^)]+)\)/\1 (\2)/g' \
                README.md
              echo ""
            fi
            if [ -f LICENSE ]; then
              echo "======== LICENSE ========"
              echo ""
              cat LICENSE
              echo ""
            fi
          } > "$STAGE/INSTALL.txt"

          ZIP_NAME="${SHORT_NAME}-v${VERSION}.zip"
          mkdir -p release-dist
          (cd release-staging && zip -r "../release-dist/${ZIP_NAME}" "${SHORT_NAME}")
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "zip_path=release-dist/${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          ls -la release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.plugin_name }} ${{ inputs.tag_name }}
          body: |
            ${{ inputs.plugin_name }} **${{ inputs.tag_name }}**

            Download the zip for a ready-to-install pack (plugin files + INSTALL.txt).

            Directory slug: `${{ inputs.plugin_slug }}`
          files: ${{ steps.stage.outputs.zip_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify shared plugin directory
        env:
          GH_TOKEN: ${{ secrets.FUGS_SITE_SYNC_TOKEN }}
          DIRECTORY_REPO: ${{ inputs.directory_repo }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          PLUGIN_NAME: ${{ inputs.plugin_name }}
          SHORT_NAME: ${{ inputs.short_name }}
          VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ inputs.tag_name }}
          FILES: ${{ inputs.files }}
          CATEGORY: ${{ inputs.category }}
          COMPATIBILITY: ${{ inputs.compatibility }}
          ZIP_NAME: ${{ steps.stage.outputs.zip_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export RELEASE_ZIP_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${ZIP_NAME}"
          export EVENT_PATH="/tmp/plugin-directory-release-event.json"

          node <<'NODE'
          const fs = require("fs");
          const files = process.env.FILES.split(/\r?\n/)
            .map((file) => file.trim())
            .filter(Boolean);
          const javascriptFiles = files.filter((file) => /\.js$/i.test(file));
          if (javascriptFiles.length === 0) throw new Error("Release contains no JavaScript plugin files");
          const source = javascriptFiles.map((file) => fs.readFileSync(file, "utf8")).join("\n");
          const description = source.match(/^\s*\*\s*@plugindesc\s+(.+)$/m)?.[1]?.trim() ?? "";
          const license = source.match(/^\s*\*\s*@license\s+(.+)$/m)?.[1]?.trim() ?? "";
          const targets = new Set([...source.matchAll(/^\s*\*\s*@target\s+(MZ|MV)\b/gm)].map((match) => match[1]));
          const inferredCompatibility = targets.has("MZ") && targets.has("MV")
            ? "MZ/MV"
            : targets.has("MZ")
              ? "MZ"
              : targets.has("MV")
                ? "MV"
                : "Unknown";

          const event = {
            event_type: "plugin-release",
            client_payload: {
              slug: process.env.PLUGIN_SLUG,
              name: process.env.PLUGIN_NAME,
              shortName: process.env.SHORT_NAME,
              version: process.env.VERSION,
              tagName: process.env.TAG_NAME,
              repository: process.env.GITHUB_REPOSITORY,
              releaseZipUrl: process.env.RELEASE_ZIP_URL,
              files,
              category: process.env.CATEGORY,
              compatibility: process.env.COMPATIBILITY,
              compatibilityConfirmed: Boolean(process.env.COMPATIBILITY),
              inferredCompatibility,
              description: description.replace(/^\[v[^\]]+\]\s*/, ""),
              license,
            },
          };
          fs.writeFileSync(process.env.EVENT_PATH, JSON.stringify(event), "utf8");
          NODE

          gh api "repos/$DIRECTORY_REPO/dispatches" --input "$EVENT_PATH"
